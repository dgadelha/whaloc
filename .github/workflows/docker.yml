name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/**"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required to push to ghcr.io with the automatic GITHUB_TOKEN.
  packages: write
  # Required by actions/attest-build-provenance (signed, verifiable build provenance).
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build, smoke-test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      # arm64 is built under emulation, which keeps the job a single runner and works on any
      # fork regardless of visibility. The build is small and the layer cache below keeps the
      # slow legs off the critical path; splitting onto native `ubuntu-*-arm` runners is a
      # possible speedup, at the cost of a per-arch matrix and a manifest merge.
      - name: Setup QEMU 🖥️
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Setup Buildx 🛠️
        uses: docker/setup-buildx-action@v4

      # GHCR always; Docker Hub joins once both its credentials exist — the repository
      # variable DOCKER_HUB_USERNAME (`gh variable set`) and the secret DOCKER_HUB_TOKEN
      # (`gh secret set`) — so a fork or a fresh clone stays green without them.
      - name: Decide where to publish 🗺️
        id: registries
        run: |
          dockerhub=''
          if [ -n "$DOCKER_HUB_TOKEN" ] && [ -n "$DOCKER_HUB_USERNAME" ]; then
            dockerhub="docker.io/$DOCKER_HUB_USERNAME/$REPO_NAME"
          fi
          {
            echo "dockerhub=$dockerhub"
            echo 'images<<IMAGES'
            echo 'ghcr.io/${{ github.repository }}'
            if [ -n "$dockerhub" ]; then echo "$dockerhub"; fi
            echo 'IMAGES'
          } >> "$GITHUB_OUTPUT"
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}

      # `latest` on the default branch, `sha-<short>` on every build, and the semver ladder
      # (1.2.3 / 1.2 / 1) on a `v*` tag — where `flavor: latest=auto` (the default) also
      # moves `latest` to the released tag.
      - name: Derive tags and labels 🏷️
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # A single-platform build the runner can actually run, so nothing is published before
      # the image has answered a request. Its layers are what the multi-platform build below
      # reuses for linux/amd64.
      - name: Build for the smoke test 🏗️
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: whaloc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image 🧪
        run: |
          set -euo pipefail
          docker run -d --name whaloc-ci -p 8080:8080 whaloc:ci
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' whaloc-ci)"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 1
          done
          docker logs whaloc-ci
          test "$(docker inspect --format '{{.State.Health.Status}}' whaloc-ci)" = "healthy"
          test "$(docker exec whaloc-ci whoami)" = "node"
          curl --fail --silent --show-error http://localhost:8080/health
          curl --fail --silent --show-error http://localhost:8080/ | grep -q "<div id=\"root\">"
          docker rm --force whaloc-ci

      - name: Login to GitHub Container Registry 🔑
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub 🔑
        if: github.event_name != 'pull_request' && steps.registries.outputs.dockerhub != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Publish 🚀
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Full SLSA provenance and an SBOM attached to the image index — buildx would only
          # attach mode=min on its own.
          provenance: mode=max
          sbom: true

      # GitHub's own signed provenance, verifiable with `gh attestation verify` and listed on
      # the repository's Attestations tab. One subject per registry the digest was pushed to.
      - name: Attest build provenance ✅
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub) ✅
        if: github.event_name != 'pull_request' && steps.registries.outputs.dockerhub != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.registries.outputs.dockerhub }}
          subject-digest: ${{ steps.publish.outputs.digest }}
